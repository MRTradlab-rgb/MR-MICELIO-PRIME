name: MR TradLab ZERO race core tests
on:
  push:
    branches:
      - feature/zero-autonomous-50-agents
  pull_request:
    branches:
      - feature/zero-autonomous-50-agents
jobs:
  race-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

name: Validate MR Micelio Prime
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate module syntax
        run: |
          node --check --input-type=module < worker.js
          node --check --input-type=module < market-feed.js
          node --check --input-type=module < race.js
          node --check --input-type=module < engine.js
          node --check --input-type=module < evolution.js

name: Validate MR TradLab ZERO engine

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/zero-autonomous-50-agents]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker modules
        run: |
          node --check --input-type=module < worker.js
          node --check --input-type=module < engine.js
          node --check --input-type=module < evolution.js
          node --check --input-type=module < race.js
          node --check src/race-core.mjs
      - name: Check whitespace
        run: git diff --check

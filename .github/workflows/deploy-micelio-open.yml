name: Deploy MICELIO OPEN
on:
  push:
    branches: [deploy/micelio-open-independent]
    paths:
      - 'micelio-open/**'
      - '.github/workflows/deploy-micelio-open.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Provision persistent D1 database
        working-directory: micelio-open
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LIST_OUTPUT="$(wrangler d1 list 2>&1)"
          DB_ID="$(printf '%s\\n' "$LIST_OUTPUT" | python -c 'import re,sys; lines=sys.stdin.read().splitlines(); pat=re.compile(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",re.I); print(next((m.group(0) for line in lines if "mr-micelio-open-db" in line for m in [pat.search(line)] if m), ""))')"
          if [ -z "$DB_ID" ]; then
            CREATE_OUTPUT="$(wrangler d1 create mr-micelio-open-db 2>&1)"
            echo "$CREATE_OUTPUT"
            DB_ID="$(printf '%s\\n' "$CREATE_OUTPUT" | grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n1)"
          fi
          test -n "$DB_ID"
          sed -i "s/SET_BY_DEPLOY_WORKFLOW/$DB_ID/" wrangler.toml
          echo "D1 database provisioned."
      - name: Apply D1 schema
        working-directory: micelio-open
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute mr-micelio-open-db --remote --file=./schema.sql
      - name: Deploy Worker
        working-directory: micelio-open
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

name: Deploy MR Micelio Prime

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'engine.js'
      - 'market-feed.js'
      - 'race.js'
      - 'evolution.js'
      - '.github/workflows/deploy-prime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PRIME branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker syntax
        run: |
          node --check --input-type=module < worker.js
          node --check --input-type=module < engine.js
          node --check --input-type=module < market-feed.js
          node --check --input-type=module < race.js
          node --check --input-type=module < evolution.js

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

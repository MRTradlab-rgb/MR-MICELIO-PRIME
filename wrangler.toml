name = "mr-micelio"
main = "worker.js"
compatibility_date = "2026-11-14"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "mr-micelio-prime-db"
database_id = "5627481f-d743-49d8-b96e-6905bac65708"

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "MARKET_FEED"
class_name = "BinanceMarketFeed"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BinanceMarketFeed"]

# Production environment variables / secrets (set in Cloudflare dashboard or Wrangler):
# CORS_ALLOWED_ORIGINS = "https://your-frontend.example,https://another.example"
# EVOLUTION_REWARDS_ENABLED = "false" (default; set true only after trusted metrics validation)
# Secrets: ENGINE_ADMIN_TOKEN and EVOLUTION_ADMIN_TOKEN (never commit values)

[observability]
enabled = true
head_sampling_rate = 0.10

[observability.traces]
enabled = true
head_sampling_rate = 0.05
